<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DAG menu preview</title>
<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
        margin: 0; height: 100vh; display: grid; grid-template-columns: 260px 1fr;
        font: 13px/1.5 'Segoe UI', system-ui, sans-serif; color: #e8ebf2; background: #0d1119;
    }
    aside { padding: 18px; border-right: 1px solid rgba(255,255,255,.08); overflow-y: auto; }
    h1 { font-size: 14px; margin: 0 0 4px; }
    p.lead { margin: 0 0 18px; font-size: 11.5px; color: rgba(232,235,242,.5); }
    h2 { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase;
         color: rgba(232,235,242,.4); margin: 18px 0 7px; }
    button, select, input {
        width: 100%; margin-bottom: 6px; padding: 7px 9px; font: inherit; font-size: 12px;
        color: inherit; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
        border-radius: 6px; cursor: pointer; text-align: left;
    }
    button:hover { background: rgba(255,255,255,.09); }
    input[type=color] { height: 32px; padding: 3px; }
    .stage { position: relative; overflow: hidden;
        background: radial-gradient(120% 90% at 20% 15%, #3a4a63 0%, #1b2330 45%, #0d1219 100%); }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .note { margin-top: 18px; font-size: 11px; color: rgba(232,235,242,.35); }
</style>
</head>
<body>
<aside>
    <h1>Menu preview</h1>
    <p class="lead">Renders <code>ui/</code> exactly as FiveM would, with no game running.</p>

    <h2>Sample</h2>
    <button data-sample="garage">Garage &mdash; icons, badges, meter</button>
    <button data-sample="colours">Submenu &mdash; breadcrumb, back</button>
    <button data-sample="long">Long list &mdash; scrolling</button>
    <button data-sample="empty">Empty menu</button>

    <h2>Federal overlays</h2>
    <button data-overlay="hud">Duty HUD &mdash; on a callout</button>
    <button data-overlay="hudQuiet">Duty HUD &mdash; no callout</button>
    <button data-overlay="hudCuffed">Duty HUD &mdash; restrained</button>
    <button data-overlay="hudOff">Hide the HUD</button>
    <button data-overlay="progress">Progress bar &mdash; 6s search</button>
    <button data-overlay="mdt">MDT &mdash; full terminal</button>
    <button data-overlay="mdtClose">Close the MDT</button>

    <h2>Theme</h2>
    <input type="color" id="accent" value="#4c8dff">
    <select id="position">
        <option value="right">Right</option>
        <option value="left">Left</option>
        <option value="center">Center</option>
        <option value="top">Top</option>
    </select>
    <select id="width">
        <option value="340">340px</option>
        <option value="384" selected>384px</option>
        <option value="440">440px</option>
    </select>

    <p class="note">Arrow keys, Enter, Backspace and Esc work inside the frame.
    Click it first so it has keyboard focus. The HUD and progress bar render
    without the menu open, exactly as they do in game.</p>
</aside>

<div class="stage"><iframe id="frame" src="../../ui/index.html"></iframe></div>

<script>
const SAMPLES = {
    garage: {
        title: 'Los Santos Customs', subtitle: 'Sandy Shores branch', canGoBack: false,
        options: [
            { title: 'Vehicle', header: true },
            { title: 'Repair vehicle', description: 'Restores engine and body health', icon: 'wrench', badge: '$1,250', badgeTone: 'accent' },
            { title: 'Respray', description: 'Primary, secondary and pearlescent', icon: 'car', submenu: true },
            { title: 'Engine condition', description: 'Wear affects top speed', icon: 'info', badge: '68%', progress: 68 },
            { title: 'Storage', header: true },
            { title: 'Open trunk', description: 'Requires the vehicle to be unlocked', icon: 'box', badge: '12/40' },
            { title: 'Impound vehicle', description: 'You do not have permission', icon: 'lock', disabled: true, badge: 'Locked', badgeTone: 'danger' },
            { title: 'Pay outstanding fees', icon: 'cash', badge: 'Paid', badgeTone: 'success' }
        ]
    },
    colours: {
        title: 'Respray', breadcrumb: 'Los Santos Customs', canGoBack: true,
        options: [
            { title: 'Classic Black', icon: '⬛', badge: '$200' },
            { title: 'Racing Red', icon: '🟥', badge: '$340' },
            { title: 'Pearl White', icon: '⬜', badge: '$540' },
            { title: 'Matte Olive', icon: '🟩', badge: '$480' }
        ]
    },
    long: {
        title: 'Impound lot', subtitle: '24 vehicles stored', canGoBack: true,
        breadcrumb: 'Police / Vehicles',
        options: Array.from({ length: 24 }, (_, i) => ({
            title: 'Vehicle ' + String(i + 1).padStart(2, '0'),
            description: i % 3 === 0 ? 'Flagged for inspection' : null,
            icon: 'car',
            badge: '$' + (150 + i * 25),
            disabled: i === 4
        }))
    },
    empty: { title: 'Watchlist', subtitle: 'Nothing tracked yet', canGoBack: true, options: [] }
};

/* The federal overlays. These render independently of the menu and take no
   input, which is why they are previewed separately from the samples above. */
const OVERLAYS = {
    hud: { action: 'hud', hud: {
        visible: true, agency: 'FIB', callsign: 'ALPHA-1', rank: 'Senior Special Agent',
        status: 'On scene', statusTone: 'accent', restrained: false,
        callout: {
            number: 'FIB-CAD-0007', label: 'Suspected wire fraud',
            objectives: [
                { label: 'Respond to the reporting business', state: 'done' },
                { label: 'Interview the branch manager', state: 'done' },
                { label: 'Recover the transfer records and prints', state: 'current' },
                { label: 'Detain the account holder', state: 'pending' }
            ]
        }
    } },
    hudQuiet: { action: 'hud', hud: {
        visible: true, agency: 'USSS', callsign: 'DETAIL-3', rank: 'Special Agent',
        status: 'Available', statusTone: 'success', restrained: false
    } },
    hudCuffed: { action: 'hud', hud: {
        visible: true, agency: 'DOA', callsign: 'INSP-2', rank: 'Field Inspector',
        status: 'Panic', statusTone: 'danger', restrained: true
    } },
    hudOff: { action: 'hud', hud: { visible: false } },
    progress: { action: 'progress:open', label: 'Searching subject', duration: 6000, cancel: true },
    mdtClose: { action: 'mdt:close' },
    mdt: { action: 'mdt:open', mdt: {
        agency: 'FIB', title: 'Federal Investigation Bureau',
        subtitle: 'Senior Special Agent | On duty', status: 'Ready',
        incidents: [
            {
                id: 'inc-1', title: 'Suspected wire fraud', meta: 'FIB-INC-0007 | Financial crime',
                pill: 'open', tone: 'accent',
                sections: [
                    { label: 'Case', fields: [
                        { label: 'Number', value: 'FIB-INC-0007' },
                        { label: 'Type', value: 'Financial crime' },
                        { label: 'Filed by', value: 'Dana Reyes' },
                        { label: 'Charges', value: 'Wire fraud, Identity theft' }
                    ] },
                    { label: 'Narrative', notes: [
                        { meta: 'Dana Reyes | 14 Mar 21:04', text: 'Branch manager reports four transfers to a shell account.' },
                        { meta: 'Dana Reyes | 14 Mar 21:22', text: 'Prints lifted from the terminal, sent to the lab.' }
                    ] }
                ],
                actions: [
                    { id: 'narrative', label: 'Add narrative' },
                    { id: 'close', label: 'Close case' },
                    { id: 'expunge', label: 'Expunge', tone: 'danger' }
                ]
            },
            { id: 'inc-2', title: 'Counterfeit currency passing', meta: 'FIB-INC-0006 | Financial crime',
              pill: 'closed', tone: 'success', sections: [], actions: [] }
        ],
        warrants: [
            { id: 'w-1', title: 'Sam Cole', meta: 'FIB-WNT-0003 | Wire fraud', pill: 'active', tone: 'danger',
              sections: [ { label: 'Warrant', fields: [
                  { label: 'Number', value: 'FIB-WNT-0003' },
                  { label: 'Reason', value: 'Wire fraud' },
                  { label: 'Issued by', value: 'Dana Reyes' }
              ] } ],
              actions: [ { id: 'serve', label: 'Mark served' }, { id: 'void', label: 'Void', tone: 'danger' } ] }
        ],
        bolos: [],
        records: [],
        evidence: [
            { id: 'e-1', title: 'Transfer records', meta: 'FIB-EVD-0011 | Document', pill: 'Analysed',
              tone: 'success', sections: [ { label: 'Chain of custody', notes: [
                  { meta: '14 Mar 21:22', text: 'Dana Reyes - collected' },
                  { meta: '14 Mar 21:48', text: 'Dana Reyes - analysed' }
              ] } ], actions: [] }
        ],
        leads: [
            { id: 'l-1', title: 'Partial plate', meta: 'A partial plate: KR41 8XZM. Run it in the CAD.',
              pill: 'New', tone: 'accent', sections: [], actions: [ { id: 'follow', label: 'Follow lead' } ] }
        ],
        reports: [],
        units: [
            { id: '2', title: 'BRAVO-2 Ali Novak', meta: 'Special Agent | fib-tower', pill: 'En route',
              tone: 'accent', sections: [], actions: [] }
        ],
        custody: []
    } }
};

const frame = document.getElementById('frame');
let sample = 'garage';

function theme() {
    return {
        accent: document.getElementById('accent').value,
        position: document.getElementById('position').value,
        width: Number(document.getElementById('width').value)
    };
}

function send() {
    frame.contentWindow.postMessage({ action: 'open', theme: theme(), menu: SAMPLES[sample] }, '*');
}

frame.addEventListener('load', send);
document.querySelectorAll('[data-sample]').forEach(btn =>
    btn.addEventListener('click', () => { sample = btn.dataset.sample; send(); }));

document.querySelectorAll('[data-overlay]').forEach(btn =>
    btn.addEventListener('click', () => {
        const key = btn.dataset.overlay;
        frame.contentWindow.postMessage(OVERLAYS[key], '*');
        /* The bar closes itself in game when the Lua timer ends; here the
           preview has to do it so the run is visible end to end. */
        if (key === 'progress') {
            setTimeout(() => frame.contentWindow.postMessage({ action: 'progress:close' }, '*'), 6000);
        }
    }));
['accent', 'position', 'width'].forEach(id =>
    document.getElementById(id).addEventListener('input', send));
</script>
</body>
</html>
