<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root" class="root" data-position="right" hidden>
        <section class="menu" role="menu" aria-label="Resource menu">
            <header class="menu__header">
                <div class="menu__breadcrumb" id="breadcrumb" hidden></div>
                <h1 class="menu__title" id="title">Menu</h1>
                <p class="menu__subtitle" id="subtitle" hidden></p>
            </header>

            <div class="menu__body">
                <ul class="menu__options" id="options"></ul>
            </div>

            <footer class="menu__footer">
                <span class="hint"><kbd>&uarr;</kbd><kbd>&darr;</kbd> Navigate</span>
                <span class="hint"><kbd>Enter</kbd> Select</span>
                <span class="hint" id="hintBack" hidden><kbd>Backspace</kbd> Back</span>
                <span class="hint"><kbd>Esc</kbd> Close</span>
            </footer>
        </section>
    </div>

    <div id="mdt" class="mdt" hidden>
        <div class="mdt__panel" role="dialog" aria-label="Mobile data terminal">
            <header class="mdt__header">
                <div class="mdt__identity">
                    <span class="mdt__badge" id="mdtAgency">FED</span>
                    <div>
                        <div class="mdt__title" id="mdtTitle">Mobile data terminal</div>
                        <div class="mdt__subtitle" id="mdtSubtitle"></div>
                    </div>
                </div>
                <button class="mdt__close" id="mdtClose" type="button" aria-label="Close">&times;</button>
            </header>

            <div class="mdt__body">
                <nav class="mdt__tabs" id="mdtTabs" role="tablist"></nav>
                <section class="mdt__content">
                    <div class="mdt__toolbar" id="mdtToolbar" hidden>
                        <input class="mdt__search" id="mdtSearch" type="text" placeholder="Search" autocomplete="off">
                    </div>
                    <div class="mdt__split">
                        <ul class="mdt__list" id="mdtList"></ul>
                        <article class="mdt__detail" id="mdtDetail"></article>
                    </div>
                </section>
            </div>

            <footer class="mdt__footer">
                <span id="mdtStatus">Ready</span>
                <span class="mdt__hint"><kbd>Esc</kbd> Close</span>
            </footer>
        </div>
    </div>

    <div id="hud" class="hud" hidden>
        <div class="hud__unit">
            <span class="hud__badge" id="hudAgency">FED</span>
            <span class="hud__callsign" id="hudCallsign"></span>
            <span class="hud__status" id="hudStatus" data-tone="success">Available</span>
        </div>
        <div class="hud__rank" id="hudRank"></div>

        <div class="hud__callout" id="hudCallout" hidden>
            <div class="hud__calloutHead">
                <span class="hud__calloutNumber" id="hudCalloutNumber"></span>
                <span class="hud__calloutLabel" id="hudCalloutLabel"></span>
            </div>
            <ol class="hud__objectives" id="hudObjectives"></ol>
        </div>

        <div class="hud__flag" id="hudRestrained" hidden>Restrained</div>
    </div>

    <div id="progress" class="progress" hidden>
        <div class="progress__label" id="progressLabel">Working</div>
        <div class="progress__track"><span class="progress__fill" id="progressFill"></span></div>
        <div class="progress__hint" id="progressHint" hidden><kbd>X</kbd> Cancel</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
